[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.1.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = arduino-libraries/Ethernet @ 2.0.2

build_src_filter = +<main.cpp>

[env:broadcast-test]
extends = env:esp32dev
build_src_filter = +<broadcast_test.cpp>

[env:every-boot-test]
extends = env:esp32dev
build_flags = -DWOL_EVERY_BOOT_TEST=1
